# ضعه في: TasyirBMD/.github/workflows/android-build.yml
name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }

      - name: Debug APK (always)
        run: gradle :app:assembleDebug --no-daemon

      # أسرار المستودع: KEYSTORE_B64 (ملف tasyirbmd.jks بصيغة base64) و TASYIR_STORE_PASSWORD
      # (و TASYIR_KEY_PASSWORD اختياري). نفس المفتاح => التحديث يُثبَّت فوق النسخة الحالية.
      - name: Restore keystore
        id: ks
        env: { KEYSTORE_B64: "${{ secrets.KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/tasyirbmd.jks
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Release APK (signed)
        if: steps.ks.outputs.ready == 'true'
        env:
          TASYIR_STORE_PASSWORD: ${{ secrets.TASYIR_STORE_PASSWORD }}
          TASYIR_KEY_PASSWORD: ${{ secrets.TASYIR_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Tasyir-Android
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.ks.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
